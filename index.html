<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Ask the Modules</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column "card catalog" — search drawer on top, a definition card, then the 3 best lessons, then everything else. */
:root{
  --bg:#f6f5fb; --panel:#ffffff; --ink:#17142b; --muted:#625d7d; --line:#e3e0f0;
  --accent:#5b3df5; --accent-ink:#ffffff; --accent-soft:#ece8ff; --mark:#ffe58a; --mark-ink:#17142b;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100e1c; --panel:#1a1730; --ink:#eeecf8; --muted:#a29dc0; --line:#2d2948;
  --accent:#8b74ff; --accent-ink:#100e1c; --accent-soft:#2a2350; --mark:#5c4a12; --mark-ink:#fff4cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100e1c; --panel:#1a1730; --ink:#eeecf8; --muted:#a29dc0; --line:#2d2948;
  --accent:#8b74ff; --accent-ink:#100e1c; --accent-soft:#2a2350; --mark:#5c4a12; --mark-ink:#fff4cc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:800 clamp(32px,6vw,52px)/1 var(--display);letter-spacing:-.02em;margin:8px 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:60ch}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:8px 10px}
.box{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:4px 6px 4px 16px}
.box:focus-within{border-color:var(--accent)}
.box svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 18px/1.2 var(--body);padding:12px 0;outline:none}
#clear{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 10px;cursor:pointer;border-radius:8px}
#clear:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 12.5px/1 var(--body);padding:7px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font:500 11px var(--mono);opacity:.65;margin-left:4px}
.try{font-size:13px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.try button{border:0;background:none;color:var(--accent);font:600 13px var(--body);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.status{font:500 12px/1 var(--mono);color:var(--muted);margin:18px 0 10px;letter-spacing:.04em}
.sec{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.def{background:var(--accent-soft);border-radius:14px;padding:14px 18px;margin-top:6px;display:grid;gap:4px}
.def .t{font:800 18px/1.2 var(--display)}
.def .s{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.def+.def{margin-top:8px}
.list{display:grid;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.item.top{border-color:var(--accent);border-width:1.5px}
.rank{font:700 11px/1 var(--mono);color:var(--accent);letter-spacing:.08em}
.where{font:500 11.5px/1.3 var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.title{font:700 16.5px/1.3 var(--body);margin:2px 0 0;text-wrap:balance}
.sum{margin:2px 0 0;color:var(--ink)}
.pending{margin:2px 0 0;color:var(--muted);font-size:13px;font-style:italic}
details{grid-column:1/-1}
summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
details ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.open{grid-row:1/3;grid-column:2;align-self:center;text-decoration:none;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--body);padding:10px 12px;border-radius:9px;white-space:nowrap}
.item:not(.top) .open{background:transparent;color:var(--accent);border:1px solid var(--line)}
@media (max-width:520px){.item{grid-template-columns:1fr}.open{grid-row:auto;grid-column:1;justify-self:start}}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted)}
.empty b{color:var(--ink)}
.reqcta{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:14px;padding:18px 20px;margin-top:14px;display:grid;gap:8px;justify-items:start}
.reqcta h3{font:800 20px/1.2 var(--display);margin:0;text-wrap:balance}
.reqcta p{margin:0;color:var(--ink)}
.reqcta .tips{font-size:13px;color:var(--muted)}
.reqbtn{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-ink);font:700 14px/1 var(--body);padding:12px 16px;border-radius:10px;margin-top:4px}
.reqbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.preview{margin-top:28px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
</style></head><body>

<div class="wrap">
  <div class="eyebrow">Inner Circle · Search the modules</div>
  <h1>Ask the Modules</h1>
  <p class="lede">Type what you're stuck on. You'll get the lessons that cover it, best match first. Watch those before asking your coach.</p>

  <div class="search">
    <div class="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Try “higgsfield”, “no sales” or “I want to quit”" autocomplete="off" aria-label="Search the modules">
      <button id="clear" type="button" hidden>Clear</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
  </div>
  <div class="try" id="try">Try:</div>

  <div id="out"></div>

  <p class="preview" id="note"></p>
</div>

<script src="data.js"></script>
<script>
const DATA=window.DATA;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[“”"'’]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9$%+ ]+/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set('a an the to of for and or in on my i im is it how do does what when where why with your you me can should be get at from this that are getting not want dont cant no any find need help use using make making about some more best good way ways learn video videos lesson lessons module modules tutorial guide show tell explain stuff thing things much'.split(' '));
const stem=w=>w.length<=4?w:w.replace(/(ies)$/,'y').replace(/(ing|ers|er|ed|es|s|ly)$/,'');

/* Concept groups: what members type → the words the lessons actually use.
   A search that hits any trigger also looks for every term in the group (at lower weight). */
const CONCEPTS=[
 {name:'AI video',t:['higgsfield','higgs field','higgs','ai video','video maker','video generator','video ai','ai videos','kling','veo','sora','runway','pika','heygen','arcads','creatify','captions ai','ai avatar','avatar','avatars','text to video','image to video','ai ugc','ai ad','ai ads','ai creative','ai creatives','ai commercial','animate'],x:['higgsfield','ai ugc','ai video','avatar','ugc','ai','creative','testing products with ai videos']},
 {name:'AI tools',t:['ai','chatgpt','chat gpt','gpt','claude','gemini','grok','prompt','prompts','prompting','automation','automate','ai tools','artificial intelligence','astra','base44','base 44','midjourney'],x:['ai','chatgpt','claude','base44','astra','prompt','ai tools']},
 {name:'Website',t:['website','site','store','shop','shopify','wix','landing page','landing','theme','template','product page','homepage','build a store','make a website','web design','domain','store design','apps'],x:['website','store','shopify','landing','base44','wix','theme','website maxxing']},
 {name:'Conversions',t:['no sales','not converting','conversion','conversions','conversion rate','checkout','add to cart','atc','visitors','traffic but no sales','bounce','trust','reviews','review','testimonials','credibility','why people dont buy','dont check out','converting','convert','not selling','no orders','no purchases','nobody buying','no one buying'],x:['conversion','checkout','trust','reviews','website','check out','landing']},
 {name:'Product research',t:['product','products','winning','winner','what to sell','find product','find products','product ideas','idea','ideas','niche','niches','trend','trends','trending','kalodata','minea','research','market research','validate','test product','testing products','product testing'],x:['winning product','product','niche','trend','kalodata','research','criteria','testing products','competitors']},
 {name:'Competitors',t:['competitor','competitors','competition','spy','ad library','stalk','copy','what others do'],x:['competitors','stalk','meta ads','winning ads','patterns']},
 {name:'Paid ads',t:['ads','ad','meta','facebook','fb','instagram ads','paid','paid ads','roas','cpm','cpc','ctr','cpa','campaign','campaigns','budget','ad set','ad creative','creatives','ads manager','ad account','pixel','targeting','retargeting','scale ads'],x:['ads','meta','fb','paid','creative','ads manager','running fb ads']},
 {name:'Organic',t:['tiktok','organic','om','views','viral','content','post','posting','posts','reels','shorts','instagram','youtube','algorithm','followers','caption','captions','hashtags','fyp','engagement','what to post','faceless','social media'],x:['organic','om','tiktok','content','post','viral','algorithm','social media']},
 {name:'Creators',t:['ugc','creator','creators','influencer','influencers','collab','collabs','partnership','outreach','dm','dms','affiliate','affiliates','ambassador'],x:['ugc','creator','creators','influencer','influencers','outreach']},
 {name:'Email & SMS',t:['email','emails','sms','text message','texts','klaviyo','abandoned','abandoned cart','cart','newsletter','flow','flows','retention','clv','lifetime value','returning customers','repeat customers','list','subscribers','crm'],x:['email','sms','klaviyo','abandoned cart','nurture','clv','crm','customers']},
 {name:'Suppliers',t:['supplier','suppliers','shipping','ship','zendrop','cj','cjdropshipping','aliexpress','alibaba','fulfillment','fulfilment','delivery','sample','samples','manufacturer','manufacturing','inventory','logistics','warehouse','agent','sourcing','private label','custom product','packaging'],x:['supplier','shipping','zendrop','logistics','manufacturer','sample','inventory','customizing your own product'],sec:'logistics'},
 {name:'Customer service',t:['refund','refunds','chargeback','chargebacks','dispute','customer service','support','returns','return','angry customer','complaint','complaints','late order','lost package'],x:['customer service','refund','chargeback','problems']},
 {name:'Money',t:['profit','profits','margin','margins','money','pricing','price','prices','break even','breakeven','cost','costs','revenue','aov','average order','upsell','upsells','bundle','bundles','cash','payment','payments','paypal','stripe','charge','charging','how much','markup','sell for','selling price','what price'],x:['profit','margin','aov','price','upsell','bundle','money','payment']},
 {name:'Scaling',t:['scale','scaling','grow','growth','meo','hire','hiring','va','assistant','team','employees','outsource','sell store','exit','multiple stores','cross platform','ringchain'],x:['scaling','scale','meo','hire','cross platform','team']},
 {name:'Branding',t:['brand','branding','logo','font','fonts','name','store name','brand name','personal brand','aesthetic'],x:['brand','branding','logo','font','personal brand']},
 {name:'Clothing brand',sec:'clothing brand',t:['clothing','clothing brand','apparel','merch','clothes','streetwear','hoodie','hoodies','tshirt','t shirt','tee','tees','blanks','embroidery','screen print','dtg','cut and sew','fashion','drop','drops'],x:['clothing','apparel','manufacturer','blanks','drop']},
 {name:'Mindset',t:['quit','quitting','give up','motivation','motivated','discipline','lazy','stuck','overwhelmed','burnout','burned out','scared','fear','afraid','doubt','faith','god','bible','mindset','consistent','consistency','procrastinate','procrastination','focus','sad','depressed','tired','hopeless'],x:['mindset','discipline','motivation','purpose','consistent','faith','dont quit']},
 {name:'Getting started',t:['start','starting','beginner','beginners','new','first','first steps','where do i start','where to start','begin','basics','foundation','roadmap','plan','checklist','organized'],x:['start','first','beginner','organized','watch this first','checklist']},
 {name:'Calls',t:['call','calls','masterclass','q and a','qa','live','coaching','mastermind','recording','replay'],x:['call','masterclass','mastermind','q and a']},
];
for(const c of CONCEPTS){c.tn=c.t.map(norm);c.xn=c.x.map(norm);}

const all=[...DATA.items];
const counts={};for(const i of all)for(const t of i.topics)counts[t]=(counts[t]||0)+1;
let topic='';

$('chips').innerHTML=['All',...DATA.topics.filter(t=>counts[t])].map(t=>`<button class="chip" type="button" data-t="${esc(t==='All'?'':t)}" aria-pressed="${t==='All'}">${esc(t)}<span class="n">${t==='All'?all.length:counts[t]}</span></button>`).join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;topic=b.dataset.t;for(const c of $('chips').children)c.setAttribute('aria-pressed',c===b);run();});
for(const s of ['higgsfield','abandoned cart','winning product','not getting views','no sales','I want to quit']){
  const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>{$('q').value=s;run();$('q').focus();};$('try').append(b);
}

/* index */
const VOC=new Map();
for(const i of all){
  i._t=norm(i.title);i._sum=norm(i.summary);i._p=norm((i.points||[]).join(' '));i._w=norm(i.where+' '+(i.also||[]).join(' '));i._tp=norm(i.topics.join(' '));
  i._all=' '+[i._t,i._sum,i._p,i._w,i._tp].join(' ')+' ';
  i._st=' '+i._all.split(' ').map(stem).join(' ')+' ';
  for(const w of i._all.split(' '))if(w.length>=4)VOC.set(w,(VOC.get(w)||0)+1);
}
for(const c of CONCEPTS)for(const w of c.tn.join(' ').split(' '))if(w.length>=4&&!VOC.has(w))VOC.set(w,1);
for(const t of DATA.terms){t._k=norm(t.term);}

function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const c=[i];let best=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<best)best=c[j]}if(best>max)return max+1;p=c}return p[b.length]}
function fix(w){if(w.length<4||VOC.has(w))return w;const max=w.length>=8?2:1;let best=null,bd=max+1,bf=0;for(const [v,f] of VOC){if(Math.abs(v.length-w.length)>max||v[0]!==w[0]&&max<2)continue;const d=lev(w,v,max);if(d<bd||(d===bd&&f>bf)){best=v;bd=d;bf=f}}return bd<=max?best:w}

const has=(hay,w)=>hay.includes(' '+w+' ')||(w.length>=4&&hay.includes(' '+w));
function fieldScore(i,w){
  let s=0;const sw=stem(w);
  const inT=has(' '+i._t+' ',w)||(sw.length>=3&&(' '+i._t+' ').split(' ').some(x=>x&&stem(x)===sw));
  if(inT)s+=6;
  if(has(' '+i._sum+' ',w))s+=4;else if(has(' '+i._p+' ',w))s+=2;
  if(has(' '+i._w+' ',w))s+=1.5;
  if(!s&&sw.length>=3&&i._st.includes(' '+sw+' '))s+=2;
  return s;
}
function plan(raw){
  const phrase=norm(raw);
  let words=phrase.split(' ').filter(w=>w&&!STOP.has(w));
  if(!words.length&&phrase)words=phrase.split(' ').filter(w=>w.length>1);
  const fixed=words.map(fix);const changed=fixed.some((w,k)=>w!==words[k]);
  const fp=' '+fixed.join(' ')+' ',pp=' '+phrase+' ';
  const hitC=CONCEPTS.filter(c=>c.tn.some(t=>pp.includes(' '+t+' ')||fp.includes(' '+t+' ')));
  const extra=[...new Set(hitC.flatMap(c=>c.xn))].filter(t=>!fixed.includes(t));
  return {phrase:norm(fixed.join(' ')),words:fixed,changed,concepts:hitC,extra};
}
function score(i,P){
  let s=0,matched=0;
  if(P.phrase.length>3){if(i._t.includes(P.phrase))s+=14;else if(i._sum.includes(P.phrase))s+=8;}
  for(const w of P.words){
    const ws=fieldScore(i,w);s+=ws;
    if(ws||P.concepts.some(c=>c.tn.some(t=>t.split(' ').includes(w))&&c.xn.some(x=>i._all.includes(' '+x+' '))))matched++;
  }
  let xs=0;for(const x of P.extra){const v=x.includes(' ')?(i._t.includes(x)?5:i._all.includes(' '+x+' ')?2.5:0):fieldScore(i,x)*0.45;xs+=v;}
  s+=Math.min(xs,9);
  for(const c of P.concepts)if(c.sec&&i._w.includes(c.sec))s+=3;
  if(P.words.length>1)s*=0.45+0.55*matched/P.words.length;
  if(i.summary)s*=1.15;else s*=0.85;
  if(i.kind==='pdf')s*=1.05;
  return s;
}
function hl(text,words){
  let t=esc(text);const ws=words.filter(w=>w.length>2);if(!ws.length)return t;
  const re=new RegExp('\\b('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return t.replace(re,'<mark>$1</mark>');
}
function card(i,words,rank){
  const pts=(i.points||[]).length?`<details><summary>What's in it (${i.points.length} points)</summary><ul>${i.points.map(p=>`<li>${hl(p,words)}</li>`).join('')}</ul></details>`:'';
  const body=i.summary?`<p class="sum">${hl(i.summary,words)}</p>`:`<p class="pending">No written summary yet. Matched on the lesson title and section.</p>`;
  const also=(i.also||[]).length?`<span>· also in ${esc(i.also.join(', '))}</span>`:'';
  return `<article class="item${rank?' top':''}">
    <div>
      <div class="where">${rank?`<span class="rank">#${rank}</span>`:''}${i.kind==='pdf'?'<span class="badge">PDF</span>':''}<span>${esc(i.where)}</span>${i.topics.length?`<span>· ${esc(i.topics.join(', '))}</span>`:''}${also}</div>
      <h3 class="title">${hl(i.title,words)}</h3>${body}
    </div>
    <a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">${i.kind==='pdf'?'Open PDF':'Open lesson'} ↗</a>${pts}
  </article>`;
}
function run(){
  const raw=$('q').value;$('clear').hidden=!raw;
  let pool=topic?all.filter(i=>i.topics.includes(topic)):all;
  const P=plan(raw);
  if(!P.words.length){
    const order={'Welcome':0,'Mindset':1};
    pool=[...pool].sort((a,b)=>(order[a.where.split(' · ')[0]]??2)-(order[b.where.split(' · ')[0]]??2));
    $('out').innerHTML=`<div class="status">${pool.length} ${topic?esc(topic)+' ':''}lessons and PDFs · type above to search</div><div class="list">${pool.map(i=>card(i,[],0)).join('')}</div>`;return;
  }
  const hlw=[...P.words,...P.extra.filter(x=>!x.includes(' '))];
  let html='';
  if(P.changed)html+=`<div class="status">Showing results for “${esc(P.words.join(' '))}”</div>`;
  if(P.concepts.length)html+=`<div class="status">Also searching: ${esc(P.concepts.map(c=>c.name).join(', '))}</div>`;
  const defs=DATA.terms.filter(t=>{const k=t._k,ph=P.phrase;return (ph.length>=2&&(k===ph||k.startsWith(ph+' ')||k.includes('('+ph)||k.split(' ').includes(ph)))||(ph.length>4&&k.includes(ph));}).slice(0,2);
  if(defs.length)html+=`<div class="sec">What it means</div>`+defs.map(d=>`<div class="def"><span class="s">Key Terms · ${esc(d.sec)}</span><span class="t">${esc(d.term)}</span><span>${esc(d.def_)}</span></div>`).join('');
  const scored=pool.map(i=>[score(i,P),i]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  const strong=scored.filter(x=>x[0]>=3).map(x=>x[1]);
  if(strong.length){
    html+=`<div class="sec">Watch these first</div><div class="list">${strong.slice(0,3).map((i,n)=>card(i,hlw,n+1)).join('')}</div>`;
    if(strong.length>3)html+=`<div class="sec">Also covers it · ${strong.length-3}</div><div class="list">${strong.slice(3,20).map(i=>card(i,hlw,0)).join('')}</div>`;
    if(strong.length>20)html+=`<div class="status">Showing the best 20 of ${strong.length}. Add a word to narrow it down.</div>`;
  }else{
    const near=scored.slice(0,5).map(x=>x[1]);
    html+=`<div class="reqcta"><span class="badge">Not in the modules yet</span><h3>No lesson covers “${esc(raw.trim())}” directly.</h3><p>Request it and we'll look at making a module on it. We already filled in what you searched for.</p><a class="reqbtn" href="${reqHref(raw)}">Request a module on this →</a></div>`;
    if(near.length)html+=`<div class="sec">Closest lessons we have</div><div class="list">${near.map(i=>card(i,hlw,0)).join('')}</div>`;
  }
  $('out').innerHTML=html;
}
function reqHref(raw){return 'request.html?topic='+encodeURIComponent(raw.trim().slice(0,120));}
let tmr;$('q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(run,110);});
$('clear').onclick=()=>{$('q').value='';run();$('q').focus();};
const secs=[...new Set(all.map(i=>i.where.split(' · ')[0]))];
$('note').textContent=`Searching all ${all.length} lessons and PDFs across ${secs.join(', ')}, plus ${DATA.terms.length} Key Terms definitions.`;
let startQ='';try{startQ=new URLSearchParams(location.search).get('q')||''}catch(e){}
$('q').value=startQ;run();

</script>
